name: Mirror image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: docker build -t gizlet-mirror:test .
      - run: bash tests/disk.sh

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/gizlet/gizlet-mirror:sha-${{ github.sha }}
      - name: Update latest from the current main
        run: |
          current_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$current_head" == "$GITHUB_SHA" ]]; then
            docker buildx imagetools create \
              --tag ghcr.io/gizlet/gizlet-mirror:latest \
              "ghcr.io/gizlet/gizlet-mirror:sha-$GITHUB_SHA"
          fi
