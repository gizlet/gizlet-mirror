name: Mirror CI and GHCR release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: docker build -t gizlet-mirror:test .
      - run: bash tests/disk.sh

  native-nginx:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install nginx and dnsmasq
        run: |
          curl -fsSL https://nginx.org/keys/nginx_signing.key | gpg --dearmor > "$RUNNER_TEMP/nginx.gpg"
          fingerprints="$(gpg --show-keys --with-colons "$RUNNER_TEMP/nginx.gpg" | cut -d: -f1,10)"
          grep -Fxq 'fpr:573BFD6B3D8FBC641079A6ABABF5BD827BD9BF62' <<< "$fingerprints"
          sudo install -m 0644 "$RUNNER_TEMP/nginx.gpg" /usr/share/keyrings/nginx-mirror-test.gpg
          echo 'deb [signed-by=/usr/share/keyrings/nginx-mirror-test.gpg] https://nginx.org/packages/ubuntu noble nginx' |
            sudo tee /etc/apt/sources.list.d/nginx-mirror-test.list
          sudo apt-get update
          sudo apt-get install -y nginx dnsmasq-base
      - run: bash tests/native-nginx.sh

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, native-nginx]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Validate release version
        if: github.ref_type == 'tag'
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/gizlet/gizlet-mirror:${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
      - name: Update latest from the newest release
        if: github.ref_type == 'tag'
        run: |
          latest_tag="$(git ls-remote --refs --tags origin 'v*' |
            sed -nE 's|^[[:xdigit:]]+[[:space:]]+refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$|\1|p' |
            sort -V | tail -n 1)"
          if [[ "$latest_tag" == "$GITHUB_REF_NAME" ]]; then
            docker buildx imagetools create \
              --tag ghcr.io/gizlet/gizlet-mirror:latest \
              "ghcr.io/gizlet/gizlet-mirror:$GITHUB_REF_NAME"
          fi
